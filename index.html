<script type="module">

/* ================================================= */
/* FIREBASE */
/* ================================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
getFirestore,
doc,
onSnapshot,
setDoc,
runTransaction
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
firebaseConfig
}
from
"./firebase-config.js";


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* ================================================= */
/* DATE LOCALE */
/* ================================================= */

const now=
new Date();

const day=
now.getFullYear()+
"-"+
String(now.getMonth()+1).padStart(2,"0")+
"-"+
String(now.getDate()).padStart(2,"0");


/* ================================================= */
/* VARIABLES */
/* ================================================= */

let tasks=[];

let notes="";

let filter="all";

let personFilter="all";

let unsub=null;

let timer=null;


/* TIMER POUR LES COMMENTAIRES */

const commentTimers={};


const $=
x=>document.getElementById(x);


/* ================================================= */
/* DATE AFFICHAGE */
/* ================================================= */

$("date").textContent=

new Intl.DateTimeFormat(
"fr-FR",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
).format(new Date());


/* ================================================= */
/* MESSAGE */
/* ================================================= */

function showMsg(x){

$("loginMsg").textContent=x;

$("loginMsg").style.display=
"block";

}


/* ================================================= */
/* ERREURS FIREBASE */
/* ================================================= */

function friendly(c){

if(
c.includes("invalid-credential")
)
return"e-mail ou mot de passe incorrect.";

if(
c.includes("email-already")
)
return"ce compte existe déjà.";

if(
c.includes("weak-password")
)
return"mot de passe trop court.";

return"Une erreur est survenue.";

}


/* ================================================= */
/* CONNEXION */
/* ================================================= */

$("signin").addEventListener(
"click",
async e=>{

e.preventDefault();

const email=
$("email")
.value
.trim();

const password=
$("password")
.value;

if(!email||!password){

showMsg(
"Merci de renseigner l'e-mail et le mot de passe."
);

return;

}

const button=
$("signin");

button.disabled=
true;

button.textContent=
"Connexion...";

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}
catch(e){

console.error(
"Erreur de connexion Firebase :",
e
);

showMsg(
friendly(e.code||"")
);

}
finally{

button.disabled=
false;

button.textContent=
"Se connecter";

}

});


/* ================================================= */
/* CREATION DU COMPTE */
/* ================================================= */

$("signup").addEventListener(
"click",
async e=>{

e.preventDefault();

const email=
$("email")
.value
.trim();

const password=
$("password")
.value;

if(!email||!password){

showMsg(
"Merci de renseigner l'e-mail et le mot de passe."
);

return;

}

try{

await createUserWithEmailAndPassword(
auth,
email,
password
);

}
catch(e){

console.error(
"Erreur de création :",
e
);

showMsg(
friendly(e.code||"")
);

}

});


/* ================================================= */
/* DECONNEXION */
/* ================================================= */

$("logout").onclick=
()=>signOut(auth);


/* ================================================= */
/* AUTHENTIFICATION */
/* ================================================= */

onAuthStateChanged(
auth,
u=>{

if(!u){

$("login").style.display=
"block";

$("app").style.display=
"none";

return;

}

$("login").style.display=
"none";

$("app").style.display=
"block";

$("status").innerHTML=
'<span class="dot"></span>Synchronisation active';

$("status").className=
"online";

listen(u.uid);

});


/* ================================================= */
/* REFERENCE FIRESTORE */
/* ================================================= */

function ref(uid){

return doc(
db,
"users",
uid,
"days",
day
);

}


/* ================================================= */
/* ECOUTE DES DONNEES */
/* ================================================= */

function listen(uid){

if(unsub)
unsub();

unsub=
onSnapshot(
ref(uid),
s=>{

const d=
s.exists()
?s.data()
:{};

tasks=
Array.isArray(d.tasks)
?d.tasks
:[];

notes=
d.notes||"";

$("notes").value=
notes;

if(!s.exists()){

setDoc(
ref(uid),
{
tasks:[],
notes:"",
date:day,
updatedAt:Date.now()
},
{
merge:true
}
)
.catch(
e=>
console.error(
"Erreur création journée :",
e
)
);

}

render();

},
error=>{

console.error(
"Erreur Firestore :",
error
);

$("status").innerHTML=
'<span class="dot"></span>Erreur de synchronisation';

$("status").className="";

}
);

}


/* ================================================= */
/* SAUVEGARDE SECURISEE */
/* ================================================= */

/*
IMPORTANT :

Toutes les modifications passent par cette fonction.

Avant de sauvegarder, Firebase est relu avec une
transaction.

Cela évite qu'un appareil possédant une ancienne
version de la liste écrase les modifications d'un
autre appareil.
*/

async function updateDay(updateFunction){

if(!auth.currentUser)
return;

const dayRef=
ref(auth.currentUser.uid);

await runTransaction(
db,
async transaction=>{

const snapshot=
await transaction.get(dayRef);

const data=
snapshot.exists()
?snapshot.data()
:{};

const currentTasks=
Array.isArray(data.tasks)
?data.tasks
:[];

const currentNotes=
typeof data.notes==="string"
?data.notes
:"";

const result=
await updateFunction(
currentTasks,
currentNotes
);

transaction.set(
dayRef,
{
tasks:
Array.isArray(result.tasks)
?result.tasks
:currentTasks,

notes:
typeof result.notes==="string"
?result.notes
:currentNotes,

date:day,

updatedAt:Date.now()
},
{
merge:true
}
);

}
);

}


/* ================================================= */
/* AJOUT TACHE */
/* ================================================= */

$("add").onclick=
async()=>{

const i=
$("taskInput");

const t=
i.value.trim();

if(!t)
return;


/* PERSONNES SELECTIONNEES */

const selectedPeople=
Array.from(
document.querySelectorAll(
"#assignees input:checked"
)
).map(
input=>input.value
);

if(!selectedPeople.length){

alert(
"Merci de sélectionner au moins une personne."
);

return;

}


/* CREATION */

const newTask={

id:crypto.randomUUID(),

text:t,

priority:$("priority").value,

assignee:selectedPeople,

done:false,

comment:""

};


/* SAUVEGARDE */

try{

await updateDay(
(currentTasks,currentNotes)=>{

return{

tasks:[
...currentTasks,
newTask
],

notes:currentNotes

};

}
);

i.value="";

}
catch(e){

console.error(
"Erreur ajout tâche :",
e
);

alert(
"Impossible d'enregistrer la tâche. Vérifie la connexion."
);

}

};


/* ================================================= */
/* ENTER POUR AJOUTER */
/* ================================================= */

$("taskInput").onkeydown=
e=>{

if(e.key==="Enter")
$("add").click();

};


/* ================================================= */
/* NOTES */
/* ================================================= */

$("notes").oninput=()=>{

clearTimeout(timer);

timer=
setTimeout(
async()=>{

const newNotes=
$("notes").value;

try{

await updateDay(
(currentTasks,currentNotes)=>{

return{

tasks:currentTasks,

notes:newNotes

};

}
);

}
catch(e){

console.error(
"Erreur sauvegarde notes :",
e
);

}

},
500
);

};


/* ================================================= */
/* COMMENTAIRE D'UNE TACHE */
/* ================================================= */

async function saveComment(id,comment){

await updateDay(
(currentTasks,currentNotes)=>{

const updatedTasks=
currentTasks.map(
t=>
t.id===id
?{
...t,
comment:comment
}
:t
);

return{

tasks:updatedTasks,

notes:currentNotes

};

}
);

}


/* ================================================= */
/* COMMENTAIRE AUTOMATIQUE */
/* ================================================= */

function updateComment(
id,
comment,
input,
status
){

if(commentTimers[id])
clearTimeout(
commentTimers[id]
);

status.textContent=
"Enregistrement...";

commentTimers[id]=
setTimeout(
async()=>{

try{

await saveComment(
id,
comment
);

status.textContent=
"✓ Enregistré";

setTimeout(
()=>{

if(status)
status.textContent="";

},
1200
);

}
catch(e){

console.error(
"Erreur sauvegarde commentaire :",
e
);

status.textContent=
"Erreur de sauvegarde";

}

},
500
);

}


/* ================================================= */
/* TERMINER UNE TACHE */
/* ================================================= */

async function toggle(id){

try{

await updateDay(
(currentTasks,currentNotes)=>{

const updatedTasks=
currentTasks.map(
t=>
t.id===id
?{
...t,
done:!t.done
}
:t
);

return{

tasks:updatedTasks,

notes:currentNotes

};

}
);

}
catch(e){

console.error(
"Erreur changement statut :",
e
);

}

}


/* ================================================= */
/* SUPPRIMER */
/* ================================================= */

async function del(id){

try{

await updateDay(
(currentTasks,currentNotes)=>{

const updatedTasks=
currentTasks.filter(
t=>t.id!==id
);

return{

tasks:updatedTasks,

notes:currentNotes

};

}
);

}
catch(e){

console.error(
"Erreur suppression tâche :",
e
);

}

}


/* ================================================= */
/* MODIFIER UNE TACHE */
/* ================================================= */

async function editTask(
id,
newText,
newPriority,
newAssignees
){

try{

await updateDay(
(currentTasks,currentNotes)=>{

const updatedTasks=
currentTasks.map(
t=>
t.id===id
?{
...t,

text:newText,

priority:newPriority,

assignee:newAssignees

}
:t
);

return{

tasks:updatedTasks,

notes:currentNotes

};

}
);

}
catch(e){

console.error(
"Erreur modification tâche :",
e
);

}

}


/* ================================================= */
/* FILTRE ETAT */
/* ================================================= */

function setFilter(f){

filter=f;

document
.querySelectorAll(
".filters:not(#peopleFilters) button"
)
.forEach(
b=>b.classList.remove("active")
);

$(
f==="done"
?"doneFilter"
:f
)
.classList.add("active");

render();

}


$("all").onclick=
()=>setFilter("all");

$("todo").onclick=
()=>setFilter("todo");

$("doneFilter").onclick=
()=>setFilter("done");


/* ================================================= */
/* FILTRE RESPONSABLE */
/* ================================================= */

function setPersonFilter(person){

personFilter=
person;

document
.querySelectorAll(
"#peopleFilters button"
)
.forEach(
b=>b.classList.remove("active")
);

const buttonId=

person==="all"
?"allPeople"

:person==="Jean-Luc"
?"jeanLucFilter"

:person==="Catherine"
?"catherineFilter"

:"yannisFilter";

$(buttonId)
.classList
.add("active");

render();

}


$("allPeople").onclick=
()=>setPersonFilter("all");

$("jeanLucFilter").onclick=
()=>setPersonFilter("Jean-Luc");

$("catherineFilter").onclick=
()=>setPersonFilter("Catherine");

$("yannisFilter").onclick=
()=>setPersonFilter("Yannis");


/* ================================================= */
/* AFFICHAGE */
/* ================================================= */

function render(){

const box=
$("tasks");

box.innerHTML="";


/* ================================================= */
/* FILTRAGE */
/* ================================================= */

const shown=
tasks.filter(
t=>{

const matchesStatus=

filter==="all"

||

filter==="todo"&&!t.done

||

filter==="done"&&t.done;


const people=

Array.isArray(t.assignee)

?t.assignee

:t.assignee
?[t.assignee]
:["Yannis"];


const matchesPerson=

personFilter==="all"

||

people.includes(
personFilter
);


return(
matchesStatus&&
matchesPerson
);

});


/* ================================================= */
/* AUCUNE TACHE */
/* ================================================= */

if(!shown.length){

box.innerHTML=

'<div style="padding:25px;text-align:center;color:#7b8791">Aucune tâche dans cette vue.</div>';

}


/* ================================================= */
/* AFFICHAGE DES TACHES */
/* ================================================= */

shown.forEach(
t=>{

const row=
document.createElement("div");

row.className=
"task";


/* ================================================= */
/* CASE A COCHER */
/* ================================================= */

const cb=
document.createElement("input");

cb.type=
"checkbox";

cb.className=
"check";

cb.checked=
t.done;

cb.onchange=
()=>toggle(t.id);


/* ================================================= */
/* ZONE CENTRALE */
/* ================================================= */

const mid=
document.createElement("div");

const title=
document.createElement("div");

title.className=
"tasktitle"+
(t.done?" done":"");

title.textContent=
t.text;


/* ================================================= */
/* RESPONSABLES */
/* ================================================= */

const people=

Array.isArray(t.assignee)

?t.assignee

:t.assignee
?[t.assignee]
:["Yannis"];


const responsible=
document.createElement("div");

responsible.className=
"assignee-badges";


people.forEach(
person=>{

const badge=
document.createElement("span");

badge.className=
"assignee-badge";


if(person==="Yannis"){

badge.classList.add(
"assignee-yannis"
);

}


if(person==="Jean-Luc"){

badge.classList.add(
"assignee-jean-luc"
);

}


if(person==="Catherine"){

badge.classList.add(
"assignee-catherine"
);

}


badge.textContent=
person;

responsible.append(
badge
);

});


/* ================================================= */
/* PRIORITE */
/* ================================================= */

const b=
document.createElement("span");

b.className=
"badge "+t.priority;

b.textContent=

t.priority==="high"
?"URGENT"

:t.priority==="med"
?"NORMAL"

:"BASSE";


/* ================================================= */
/* INFORMATIONS */
/* ================================================= */

const info=
document.createElement("div");

info.style.marginTop=
"5px";

info.append(
responsible,
b
);


/* ================================================= */
/* COMMENTAIRE */
/* ================================================= */

const commentContainer=
document.createElement("div");

commentContainer.className=
"task-comment";


const commentLabel=
document.createElement("div");

commentLabel.className=
"task-comment-label";

commentLabel.textContent=
"Commentaire";


const commentInput=
document.createElement("textarea");

commentInput.className=
"task-comment-input";

commentInput.rows=
1;

commentInput.placeholder=
"Ajouter un commentaire...";

commentInput.value=
t.comment||"";


const commentStatus=
document.createElement("div");

commentStatus.className=
"comment-status";


commentInput.addEventListener(
"input",
()=>{

updateComment(
t.id,
commentInput.value,
commentInput,
commentStatus
);

});


commentContainer.append(
commentLabel,
commentInput,
commentStatus
);


/* ================================================= */
/* ACTIONS */
/* ================================================= */

const right=
document.createElement("div");

right.className=
"task-actions";


/* ================================================= */
/* MODIFIER */
/* ================================================= */

const edit=
document.createElement("button");

edit.className=
"edit";

edit.textContent=
"✏️";

edit.title=
"Modifier la tâche";


edit.onclick=
()=>{

/* FORMULAIRE */

const form=
document.createElement("div");

form.className=
"edit-form";


/* TEXTE */

const input=
document.createElement("input");

input.className=
"edit-text";

input.value=
t.text;


/* PRIORITE */

const select=
document.createElement("select");

select.className=
"edit-priority";

select.innerHTML=`

<option value="high">
Priorité haute
</option>

<option value="med">
Priorité normale
</option>

<option value="low">
Priorité basse
</option>

`;

select.value=
t.priority;


/* RESPONSABLES */

const editAssignees=
document.createElement("div");

editAssignees.className=
"assignees";


const currentPeople=

Array.isArray(t.assignee)

?t.assignee

:t.assignee
?[t.assignee]
:["Yannis"];


[
"Yannis",
"Jean-Luc",
"Catherine"
]
.forEach(
person=>{

const label=
document.createElement("label");

label.className=
"person-checkbox "+
(
person==="Yannis"
?"yannis"

:person==="Jean-Luc"
?"jean-luc"

:"catherine"
);


const checkbox=
document.createElement("input");

checkbox.type=
"checkbox";

checkbox.value=
person;

checkbox.checked=
currentPeople.includes(
person
);


const span=
document.createElement("span");

span.textContent=
person;


label.append(
checkbox,
span
);

editAssignees.append(
label
);

});


/* ================================================= */
/* SAUVEGARDER */
/* ================================================= */

const saveBtn=
document.createElement("button");

saveBtn.className=
"save-edit";

saveBtn.textContent=
"💾";

saveBtn.title=
"Enregistrer";


saveBtn.onclick=
async()=>{

const text=
input.value.trim();

if(!text)
return;


const selectedPeople=
Array.from(
editAssignees.querySelectorAll(
"input:checked"
)
).map(
input=>input.value
);


if(!selectedPeople.length){

alert(
"Merci de sélectionner au moins une personne."
);

return;

}


await editTask(
t.id,
text,
select.value,
selectedPeople
);

};


/* ================================================= */
/* ANNULER */
/* ================================================= */

const cancelBtn=
document.createElement("button");

cancelBtn.className=
"cancel-edit";

cancelBtn.textContent=
"❌";

cancelBtn.title=
"Annuler";

cancelBtn.onclick=
()=>render();


/* ================================================= */
/* FORMULAIRE */
/* ================================================= */

form.append(
input,
select,
editAssignees
);


/* ================================================= */
/* REMPLACEMENT */
/* ================================================= */

mid.innerHTML="";

mid.append(
form
);

right.innerHTML="";

right.append(
saveBtn,
cancelBtn
);


input.focus();

input.select();

};


/* ================================================= */
/* SUPPRIMER */
/* ================================================= */

const d=
document.createElement("button");

d.className=
"delete";

d.textContent=
"×";

d.title=
"Supprimer la tâche";

d.onclick=
()=>del(t.id);


/* ================================================= */
/* ACTIONS */
/* ================================================= */

right.append(
edit,
d
);


/* ================================================= */
/* AFFICHAGE FINAL */
/* ================================================= */

mid.append(
title,
info,
commentContainer
);

row.append(
cb,
mid,
right
);

box.append(
row
);

});


/* ================================================= */
/* STATISTIQUES */
/* ================================================= */

const total=
tasks.length;

const done=
tasks.filter(
t=>t.done
).length;

const p=

total

?Math.round(
done/total*100
)

:0;


$("total").textContent=
total;

$("done").textContent=
done;

$("remain").textContent=
total-done;

$("pct").textContent=
p+"%";

$("fill").style.width=
p+"%";


/* ================================================= */
/* PRIORITES */
/* ================================================= */

const high=
tasks.filter(
t=>
!t.done&&
t.priority==="high"
).length;


$("prioritySummary").innerHTML=

high

?`<strong>${high}</strong> tâche(s) urgente(s) à traiter.`

:"Aucune tâche prioritaire en attente. 👍";

}


/* ================================================= */
/* SERVICE WORKER */
/* ================================================= */

if(
"serviceWorker"
in navigator
){

navigator.serviceWorker.register(
"sw.js"
)
.then(
registration=>{

console.log(
"Service Worker enregistré :",
registration.scope
);

}
)
.catch(
error=>{

console.error(
"Erreur Service Worker :",
error
);

}
);

}

</script>
