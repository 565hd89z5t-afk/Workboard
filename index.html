<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#111827"
>

<link rel="manifest" href="./manifest.json">

<title>WorkBoard — Synchronisé</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#1f2937;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* =============================== */
/* LOGIN */
/* =============================== */

#login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.login-card h1{
  margin-top:0;
  text-align:center;
}

.login-card input{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
}

.login-buttons{
  display:flex;
  gap:10px;
}

.login-buttons button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

.login-buttons button:last-child{
  background:#6b7280;
}

#loginMsg{
  display:none;
  margin-top:15px;
  padding:10px;
  background:#fee2e2;
  color:#991b1b;
  border-radius:8px;
}

/* =============================== */
/* APP */
/* =============================== */

#app{
  display:none;
}

header{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

h1{
  margin:0;
}

#date{
  margin-top:8px;
  color:#6b7280;
  text-transform:capitalize;
}

#logout{
  border:0;
  background:#ef4444;
  color:white;
  padding:10px 14px;
  border-radius:8px;
}

#status{
  margin-top:12px;
  font-size:14px;
}

#status.online{
  color:#16a34a;
}

.dot{
  display:inline-block;
  width:9px;
  height:9px;
  background:#22c55e;
  border-radius:50%;
  margin-right:6px;
}

/* =============================== */
/* AJOUT */
/* =============================== */

.add-card{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.add-row{
  display:flex;
  gap:10px;
}

#taskInput{
  flex:1;
  min-width:0;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
}

#priority{
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
}

#add{
  padding:12px 20px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

/* =============================== */
/* RESPONSABLES */
/* =============================== */

.assignees{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.person-checkbox{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #d1d5db;
  background:#f9fafb;
}

.person-checkbox.yannis{
  border-color:#93c5fd;
}

.person-checkbox.jean-luc{
  border-color:#c4b5fd;
}

.person-checkbox.catherine{
  border-color:#f9a8d4;
}

/* =============================== */
/* FILTRES */
/* =============================== */

.filters-card{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.filters-title{
  font-weight:bold;
  margin-bottom:10px;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.filters button{
  padding:9px 14px;
  border:1px solid #d1d5db;
  background:white;
  border-radius:8px;
}

.filters button.active{
  background:#111827;
  color:white;
  border-color:#111827;
}

/* =============================== */
/* NOTES */
/* =============================== */

.notes-card{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

#notes{
  width:100%;
  min-height:100px;
  resize:vertical;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
}

/* =============================== */
/* STATISTIQUES */
/* =============================== */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:16px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.stat-value{
  font-size:26px;
  font-weight:bold;
}

.progress{
  height:10px;
  background:#e5e7eb;
  border-radius:10px;
  overflow:hidden;
  margin-top:15px;
}

#fill{
  height:100%;
  width:0;
  background:#22c55e;
  transition:width .3s;
}

.priority-summary{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}

/* =============================== */
/* TACHES */
/* =============================== */

#tasks{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.task{
  background:white;
  padding:16px;
  border-radius:14px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:14px;
  align-items:start;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.check{
  width:20px;
  height:20px;
  margin-top:3px;
}

.tasktitle{
  font-size:17px;
  font-weight:bold;
}

.tasktitle.done{
  text-decoration:line-through;
  color:#9ca3af;
}

.assignee-badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:6px;
}

.assignee-badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
  background:#e5e7eb;
}

.assignee-yannis{
  background:#dbeafe;
  color:#1d4ed8;
}

.assignee-jean-luc{
  background:#ede9fe;
  color:#6d28d9;
}

.assignee-catherine{
  background:#fce7f3;
  color:#be185d;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
}

.badge.high{
  background:#fee2e2;
  color:#b91c1c;
}

.badge.med{
  background:#fef3c7;
  color:#92400e;
}

.badge.low{
  background:#dcfce7;
  color:#166534;
}

/* =============================== */
/* COMMENTAIRES */
/* =============================== */

.task-comment{
  margin-top:12px;
}

.task-comment-label{
  font-size:12px;
  color:#6b7280;
  margin-bottom:4px;
}

.task-comment-input{
  width:100%;
  min-height:38px;
  resize:vertical;
  padding:8px;
  border:1px solid #d1d5db;
  border-radius:7px;
}

.comment-status{
  font-size:11px;
  color:#16a34a;
  min-height:15px;
  margin-top:3px;
}

/* =============================== */
/* ACTIONS */
/* =============================== */

.task-actions{
  display:flex;
  gap:6px;
}

.task-actions button{
  width:36px;
  height:36px;
  border:0;
  border-radius:8px;
}

.edit{
  background:#e0f2fe;
}

.delete{
  background:#fee2e2;
  color:#b91c1c;
  font-size:20px;
}

/* =============================== */
/* MODIFICATION */
/* =============================== */

.edit-form{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.edit-text,
.edit-priority{
  width:100%;
  padding:9px;
  border:1px solid #d1d5db;
  border-radius:7px;
}

.save-edit{
  background:#dcfce7;
}

.cancel-edit{
  background:#fee2e2;
}

/* =============================== */
/* MOBILE */
/* =============================== */

@media(max-width:700px){

  .container{
    padding:10px;
  }

  .header-top{
    align-items:flex-start;
  }

  .add-row{
    flex-direction:column;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .task{
    grid-template-columns:auto 1fr;
  }

  .task-actions{
    grid-column:2;
  }

}

</style>
</head>

<body>

<!-- ================================================= -->
<!-- CONNEXION -->
<!-- ================================================= -->

<section id="login">

  <div class="login-card">

    <h1>WorkBoard</h1>

    <input
      id="email"

<!-- ================================================= -->
<!-- APPLICATION -->
<!-- ================================================= -->

<section id="app">

  <div class="container">

    <header>

      <div class="header-top">

        <div>

          <h1>WorkBoard</h1>

          <div id="date"></div>

        </div>

        <button id="logout">

        </button>

      </div>

      <div id="status">

<!-- ================================================= -->
<!-- FIREBASE / JAVASCRIPT -->
<!-- ================================================= -->

<script type="module">

/* ================================================= */
/* FIREBASE */
/* ================================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  onSnapshot,
  setDoc,
  runTransaction
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
  firebaseConfig
}
from
"./firebase-config.js";


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ================================================= */
/* DATE LOCALE */
/* ================================================= */

const now =
  new Date();

const day =
  now.getFullYear() +
  "-" +
  String(now.getMonth()+1).padStart(2,"0") +
  "-" +
  String(now.getDate()).padStart(2,"0");


/* ================================================= */
/* VARIABLES */
/* ================================================= */

let tasks = [];

let notes = "";

let filter = "all";

let personFilter = "all";

let unsub = null;

let timer = null;

const commentTimers = {};

/*
 * Permet de conserver le commentaire en cours
 * même lorsque Firebase déclenche un nouveau render().
 */
let activeCommentId = null;
let activeCommentStart = 0;
let activeCommentEnd = 0;
let commentDrafts = {};


const $ =
  x => document.getElementById(x);


/* ================================================= */
/* DATE AFFICHAGE */
/* ================================================= */

$("date").textContent =

new Intl.DateTimeFormat(
  "fr-FR",
  {
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  }
).format(new Date());


/* ================================================= */
/* MESSAGE */
/* ================================================= */

function showMsg(x){

  $("loginMsg").textContent = x;

  $("loginMsg").style.display =
    "block";

}


/* ================================================= */
/* ERREURS FIREBASE */
/* ================================================= */

function friendly(c){

  if(c.includes("invalid-credential"))
    return "e-mail ou mot de passe incorrect.";

  if(c.includes("email-already"))
    return "ce compte existe déjà.";

  if(c.includes("weak-password"))
    return "mot de passe trop court.";

  return "Une erreur est survenue.";

}


/* ================================================= */
/* CONNEXION */
/* ================================================= */

$("signin").addEventListener(
  "click",
  async e => {

    e.preventDefault();

    const email =
      $("email").value.trim();

    const password =
      $("password").value;

    if(!email || !password){

      showMsg(
        "Merci de renseigner l'e-mail et le mot de passe."
      );

      return;

    }

    const button =
      $("signin");

    button.disabled = true;

    button.textContent =
      "Connexion...";

    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }
    catch(e){

      console.error(
        "Erreur de connexion Firebase :",
        e
      );

      showMsg(
        friendly(e.code || "")
      );

    }
    finally{

      button.disabled = false;

      button.textContent =
        "Se connecter";

    }

  }
);


/* ================================================= */
/* CREATION DU COMPTE */
/* ================================================= */

$("signup").addEventListener(
  "click",
  async e => {

    e.preventDefault();

    const email =
      $("email").value.trim();

    const password =
      $("password").value;

    if(!email || !password){

      showMsg(
        "Merci de renseigner l'e-mail et le mot de passe."
      );

      return;

    }

    try{

      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    }
    catch(e){

      console.error(
        "Erreur de création :",
        e
      );

      showMsg(
        friendly(e.code || "")
      );

    }

  }
);


/* ================================================= */
/* DECONNEXION */
/* ================================================= */

$("logout").onclick =
  () => signOut(auth);


/* ================================================= */
/* REFERENCE FIRESTORE */
/* ================================================= */

function ref(uid){

  return doc(
    db,
    "users",
    uid,
    "days",
    day
  );

}


/* ================================================= */
/* ECOUTE DES DONNEES */
/* ================================================= */

function listen(uid){

  if(unsub)
    unsub();

  unsub =
    onSnapshot(
      ref(uid),
      s => {

        const d =
          s.exists()
          ? s.data()
          : {};

        tasks =
          Array.isArray(d.tasks)
          ? d.tasks
          : [];

        notes =
          typeof d.notes === "string"
          ? d.notes
          : "";

        $("notes").value =
          notes;


        if(!s.exists()){

          setDoc(
            ref(uid),
            {
              tasks:[],
              notes:"",
              date:day,
              updatedAt:Date.now()
            },
            {
              merge:true
            }
          )
          .catch(
            e =>
              console.error(
                "Erreur création journée :",
                e
              )
          );

        }

        render();

      },
      error => {

        console.error(
          "Erreur Firestore :",
          error
        );

        $("status").innerHTML =
          '<span class="dot"></span>Erreur de synchronisation';

        $("status").className = "";

      }
    );

}


/* ================================================= */
/* SAUVEGARDE SECURISEE */
/* ================================================= */

async function updateDay(updateFunction){

  if(!auth.currentUser)
    return;

  const dayRef =
    ref(auth.currentUser.uid);

  await runTransaction(
    db,
    async transaction => {

      const snapshot =
        await transaction.get(dayRef);

      const data =
        snapshot.exists()
        ? snapshot.data()
        : {};

      const currentTasks =
        Array.isArray(data.tasks)
        ? data.tasks
        : [];

      const currentNotes =
        typeof data.notes === "string"
        ? data.notes
        : "";

      const result =
        await updateFunction(
          currentTasks,
          currentNotes
        );

      transaction.set(
        dayRef,
        {
          tasks:
            Array.isArray(result.tasks)
            ? result.tasks
            : currentTasks,

          notes:
            typeof result.notes === "string"
            ? result.notes
            : currentNotes,

          date:day,

          updatedAt:Date.now()
        },
        {
          merge:true
        }
      );

    }
  );

}


/* ================================================= */
/* AJOUT TACHE */
/* ================================================= */

$("add").onclick =
  async () => {

    const i =
      $("taskInput");

    const t =
      i.value.trim();

    if(!t)
      return;


    const selectedPeople =
      Array.from(
        document.querySelectorAll(
          "#assignees input:checked"
        )
      )
      .map(
        input => input.value
      );


    if(!selectedPeople.length){

      alert(
        "Merci de sélectionner au moins une personne."
      );

      return;

    }


    const newTask = {

      id:crypto.randomUUID(),

      text:t,

      priority:$("priority").value,

      assignee:selectedPeople,

      done:false,

      comment:""

    };


    try{

      await updateDay(
        (currentTasks,currentNotes) => {

          return {

            tasks:[
              ...currentTasks,
              newTask
            ],

            notes:currentNotes

          };

        }
      );

      i.value = "";

    }
    catch(e){

      console.error(
        "Erreur ajout tâche :",
        e
      );

      alert(
        "Impossible d'enregistrer la tâche. Vérifie la connexion."
      );

    }

  };


/* ================================================= */
/* ENTER POUR AJOUTER */
/* ================================================= */

$("taskInput").onkeydown =
  e => {

    if(e.key === "Enter")
      $("add").click();

  };


/* ================================================= */
/* NOTES */
/* ================================================= */

$("notes").oninput =
  () => {

    clearTimeout(timer);

    timer =
      setTimeout(
        async () => {

          const newNotes =
            $("notes").value;

          try{

            await updateDay(
              (currentTasks,currentNotes) => {

                return {

                  tasks:currentTasks,

                  notes:newNotes

                };

              }
            );

          }
          catch(e){

            console.error(
              "Erreur sauvegarde notes :",
              e
            );

          }

        },
        500
      );

  };


/* ================================================= */
/* COMMENTAIRE */
/* ================================================= */

async function saveComment(id,comment){

  await updateDay(
    (currentTasks,currentNotes) => {

      const updatedTasks =
        currentTasks.map(
          t =>
            t.id === id
            ? {
                ...t,
                comment:comment
              }
            : t
        );

      return {

        tasks:updatedTasks,

        notes:currentNotes

      };

    }
  );

}


function updateComment(
  id,
  comment,
  input,
  status
){

  /*
   * Sauvegarde du brouillon local.
   * Cela permet de le remettre dans le champ
   * si Firebase déclenche un render().
   */
  commentDrafts[id] = comment;

  /*
   * Mémorisation du champ actif et de la position
   * du curseur.
   */
  activeCommentId = id;

  activeCommentStart =
    input.selectionStart;

  activeCommentEnd =
    input.selectionEnd;


  if(commentTimers[id])
    clearTimeout(
      commentTimers[id]
    );


  status.textContent =
    "Enregistrement...";


  commentTimers[id] =
    setTimeout(
      async () => {

        try{

          await saveComment(
            id,
            comment
          );

          /*
           * On ne supprime pas immédiatement le brouillon
           * si l'utilisateur est toujours en train d'écrire.
           */
          if(
            activeCommentId !== id ||
            document.activeElement !== input
          ){

            delete commentDrafts[id];

          }


          status.textContent =
            "✓ Enregistré";


          setTimeout(
            () => {

              if(status)
                status.textContent = "";

            },
            1200
          );

        }
        catch(e){

          console.error(
            "Erreur sauvegarde commentaire :",
            e
          );

          status.textContent =
            "Erreur de sauvegarde";

        }

      },
      500
    );

}


/* ================================================= */
/* TERMINER */
/* ================================================= */

async function toggle(id){

  try{

    await updateDay(
      (currentTasks,currentNotes) => {

        const updatedTasks =
          currentTasks.map(
            t =>
              t.id === id
              ? {
                  ...t,
                  done:!t.done
                }
              : t
          );

        return {

          tasks:updatedTasks,

          notes:currentNotes

        };

      }
    );

  }
  catch(e){

    console.error(
      "Erreur changement statut :",
      e
    );

  }

}


/* ================================================= */
/* SUPPRIMER */
/* ================================================= */

async function del(id){

  try{

    await updateDay(
      (currentTasks,currentNotes) => {

        const updatedTasks =
          currentTasks.filter(
            t => t.id !== id
          );

        return {

          tasks:updatedTasks,

          notes:currentNotes

        };

      }
    );

  }
  catch(e){

    console.error(
      "Erreur suppression tâche :",
      e
    );

  }

}


/* ================================================= */
/* MODIFIER */
/* ================================================= */

async function editTask(
  id,
  newText,
  newPriority,
  newAssignees
){

  try{

    await updateDay(
      (currentTasks,currentNotes) => {

        const updatedTasks =
          currentTasks.map(
            t =>
              t.id === id
              ? {
                  ...t,
                  text:newText,
                  priority:newPriority,
                  assignee:newAssignees
                }
              : t
          );

        return {

          tasks:updatedTasks,

          notes:currentNotes

        };

      }
    );

  }
  catch(e){

    console.error(
      "Erreur modification tâche :",
      e
    );

  }

}


/* ================================================= */
/* FILTRE ETAT */
/* ================================================= */

function setFilter(f){

  filter = f;

  document
    .querySelectorAll(
      ".filters:not(#peopleFilters) button"
    )
    .forEach(
      b =>
        b.classList.remove("active")
    );

  $(
    f === "done"
    ? "doneFilter"
    : f
  )
  .classList.add("active");

  render();

}


$("all").onclick =
  () => setFilter("all");

$("todo").onclick =
  () => setFilter("todo");

$("doneFilter").onclick =
  () => setFilter("done");


/* ================================================= */
/* FILTRE RESPONSABLE */
/* ================================================= */

function setPersonFilter(person){

  personFilter =
    person;

  document
    .querySelectorAll(
      "#peopleFilters button"
    )
    .forEach(
      b =>
        b.classList.remove("active")
    );

  const buttonId =

    person === "all"
    ? "allPeople"

    : person === "Jean-Luc"
    ? "jeanLucFilter"

    : person === "Catherine"
    ? "catherineFilter"

    : "yannisFilter";


  $(buttonId)
    .classList
    .add("active");

  render();

}


$("allPeople").onclick =
  () => setPersonFilter("all");

$("jeanLucFilter").onclick =
  () => setPersonFilter("Jean-Luc");

$("catherineFilter").onclick =
  () => setPersonFilter("Catherine");

$("yannisFilter").onclick =
  () => setPersonFilter("Yannis");


/* ================================================= */
/* AFFICHAGE */
/* ================================================= */

function render(){

  const box =
    $("tasks");


  /*
   * AVANT de reconstruire la liste :
   * on mémorise le champ commentaire actuellement actif.
   */
  const focusedComment =
    document.activeElement &&
    document.activeElement.classList.contains(
      "task-comment-input"
    )
    ? document.activeElement
    : null;


  if(focusedComment){

    activeCommentId =
      focusedComment.dataset.taskId || null;

    activeCommentStart =
      focusedComment.selectionStart;

    activeCommentEnd =
      focusedComment.selectionEnd;

    /*
     * On garde aussi la valeur actuelle.
     * Cela évite de perdre une lettre tapée pendant
     * qu'une mise à jour Firebase arrive.
     */
    if(activeCommentId){

      commentDrafts[activeCommentId] =
        focusedComment.value;

    }

  }


  box.innerHTML = "";


  const shown =
    tasks.filter(
      t => {

        const matchesStatus =

          filter === "all"

          ||

          filter === "todo" && !t.done

          ||

          filter === "done" && t.done;


        const people =

          Array.isArray(t.assignee)

          ? t.assignee

          : t.assignee
            ? [t.assignee]
            : ["Yannis"];


        const matchesPerson =

          personFilter === "all"

          ||

          people.includes(
            personFilter
          );


        return (
          matchesStatus &&
          matchesPerson
        );

      }
    );


  if(!shown.length){

    box.innerHTML =
      '<div style="padding:25px;text-align:center;color:#7b8791">Aucune tâche dans cette vue.</div>';

  }


  shown.forEach(
    t => {

      const row =
        document.createElement("div");

      row.className =
        "task";


      const cb =
        document.createElement("input");

      cb.type =
        "checkbox";

      cb.className =
        "check";

      cb.checked =
        t.done;

      cb.onchange =
        () => toggle(t.id);


      const mid =
        document.createElement("div");


      const title =
        document.createElement("div");

      title.className =
        "tasktitle" +
        (t.done ? " done" : "");

      title.textContent =
        t.text;


      const people =

        Array.isArray(t.assignee)

        ? t.assignee

        : t.assignee
          ? [t.assignee]
          : ["Yannis"];


      const responsible =
        document.createElement("div");

      responsible.className =
        "assignee-badges";


      people.forEach(
        person => {

          const badge =
            document.createElement("span");

          badge.className =
            "assignee-badge";


          if(person === "Yannis")
            badge.classList.add(
              "assignee-yannis"
            );


          if(person === "Jean-Luc")
            badge.classList.add(
              "assignee-jean-luc"
            );


          if(person === "Catherine")
            badge.classList.add(
              "assignee-catherine"
            );


          badge.textContent =
            person;

          responsible.append(
            badge
          );

        }
      );


      const b =
        document.createElement("span");

      b.className =
        "badge " + t.priority;

      b.textContent =

        t.priority === "high"
        ? "URGENT"

        : t.priority === "med"
        ? "NORMAL"

        : "BASSE";


      const info =
        document.createElement("div");

      info.style.marginTop =
        "5px";

      info.append(
        responsible,
        b
      );


      /* ================================================= */
      /* COMMENTAIRE */
      /* ================================================= */

      const commentContainer =
        document.createElement("div");

      commentContainer.className =
        "task-comment";


      const commentLabel =
        document.createElement("div");

      commentLabel.className =
        "task-comment-label";

      commentLabel.textContent =
        "Commentaire";


      const commentInput =
        document.createElement("textarea");

      commentInput.className =
        "task-comment-input";

      commentInput.rows =
        1;

      commentInput.placeholder =
        "Ajouter un commentaire...";


      /*
       * Identifiant de la tâche associé au champ.
       */
      commentInput.dataset.taskId =
        t.id;


      /*
       * Si un brouillon est actuellement en cours,
       * on l'affiche plutôt que l'ancienne valeur Firebase.
       */
      commentInput.value =

        Object.prototype.hasOwnProperty.call(
          commentDrafts,
          t.id
        )

        ? commentDrafts[t.id]

        : (t.comment || "");


      const commentStatus =
        document.createElement("div");

      commentStatus.className =
        "comment-status";


      commentInput.addEventListener(
        "focus",
        () => {

          activeCommentId =
            t.id;

          activeCommentStart =
            commentInput.selectionStart;

          activeCommentEnd =
            commentInput.selectionEnd;

        }
      );


      commentInput.addEventListener(
        "click",
        () => {

          activeCommentId =
            t.id;

          activeCommentStart =
            commentInput.selectionStart;

          activeCommentEnd =
            commentInput.selectionEnd;

        }
      );


      commentInput.addEventListener(
        "keyup",
        () => {

          if(
            document.activeElement === commentInput
          ){

            activeCommentId =
              t.id;

            activeCommentStart =
              commentInput.selectionStart;

            activeCommentEnd =
              commentInput.selectionEnd;

          }

        }
      );


      commentInput.addEventListener(
        "input",
        () => {

          activeCommentId =
            t.id;

          activeCommentStart =
            commentInput.selectionStart;

          activeCommentEnd =
            commentInput.selectionEnd;


          updateComment(
            t.id,
            commentInput.value,
            commentInput,
            commentStatus
          );

        }
      );


      commentContainer.append(
        commentLabel,
        commentInput,
        commentStatus
      );


      /* ================================================= */
      /* ACTIONS */
      /* ================================================= */

      const right =
        document.createElement("div");

      right.className =
        "task-actions";


      /* ================================================= */
      /* MODIFIER */
      /* ================================================= */

      const edit =
        document.createElement("button");

      edit.className =
        "edit";

      edit.textContent =
        "✏️";

      edit.title =
        "Modifier la tâche";


      edit.onclick =
        () => {

          const form =
            document.createElement("div");

          form.className =
            "edit-form";


          const input =
            document.createElement("input");

          input.className =
            "edit-text";

          input.value =
            t.text;


          const select =
            document.createElement("select");

          select.className =
            "edit-priority";

          select.innerHTML = `

            <option value="high">
              Priorité haute
            </option>

            <option value="med">
              Priorité normale
            </option>

            <option value="low">
              Priorité basse
            </option>

          `;

          select.value =
            t.priority;


          const editAssignees =
            document.createElement("div");

          editAssignees.className =
            "assignees";


          const currentPeople =

            Array.isArray(t.assignee)

            ? t.assignee

            : t.assignee
              ? [t.assignee]
              : ["Yannis"];


          [
            "Yannis",
            "Jean-Luc",
            "Catherine"
          ]
          .forEach(
            person => {

              const label =
                document.createElement("label");

              label.className =
                "person-checkbox " +

                (
                  person === "Yannis"
                  ? "yannis"

                  : person === "Jean-Luc"
                  ? "jean-luc"

                  : "catherine"
                );


              const checkbox =
                document.createElement("input");

              checkbox.type =
                "checkbox";

              checkbox.value =
                person;

              checkbox.checked =
                currentPeople.includes(
                  person
                );


              const span =
                document.createElement("span");

              span.textContent =
                person;


              label.append(
                checkbox,
                span
              );

              editAssignees.append(
                label
              );

            }
          );


          const saveBtn =
            document.createElement("button");

          saveBtn.className =
            "save-edit";

          saveBtn.textContent =
            "💾";

          saveBtn.title =
            "Enregistrer";


          saveBtn.onclick =
            async () => {

              const text =
                input.value.trim();

              if(!text)
                return;


              const selectedPeople =
                Array.from(
                  editAssignees.querySelectorAll(
                    "input:checked"
                  )
                )
                .map(
                  input =>
                    input.value
                );


              if(!selectedPeople.length){

                alert(
                  "Merci de sélectionner au moins une personne."
                );

                return;

              }


              await editTask(
                t.id,
                text,
                select.value,
                selectedPeople
              );

            };


          const cancelBtn =
            document.createElement("button");

          cancelBtn.className =
            "cancel-edit";

          cancelBtn.textContent =
            "❌";

          cancelBtn.title =
            "Annuler";

          cancelBtn.onclick =
            () => render();


          form.append(
            input,
            select,
            editAssignees
          );


          mid.innerHTML = "";

          mid.append(
            form
          );


          right.innerHTML = "";

          right.append(
            saveBtn,
            cancelBtn
          );


          input.focus();

          input.select();

        };


      /* ================================================= */
      /* SUPPRIMER */
      /* ================================================= */

      const d =
        document.createElement("button");

      d.className =
        "delete";

      d.textContent =
        "×";

      d.title =
        "Supprimer la tâche";

      d.onclick =
        () => del(t.id);


      right.append(
        edit,
        d
      );


      mid.append(
        title,
        info,
        commentContainer
      );


      row.append(
        cb,
        mid,
        right
      );


      box.append(
        row
      );

    }
  );


  /*
   * APRÈS reconstruction :
   * on remet automatiquement le focus dans le commentaire
   * qui était en train d'être modifié.
   */
  if(activeCommentId){

    const idToRestore =
      activeCommentId;

    const startToRestore =
      activeCommentStart;

    const endToRestore =
      activeCommentEnd;


    setTimeout(
      () => {

        const newInput =
          box.querySelector(
            `.task-comment-input[data-task-id="${CSS.escape(idToRestore)}"]`
          );


        if(!newInput)
          return;


        /*
         * On remet le brouillon dans le champ.
         */
        if(
          Object.prototype.hasOwnProperty.call(
            commentDrafts,
            idToRestore
          )
        ){

          newInput.value =
            commentDrafts[idToRestore];

        }


        /*
         * Remettre le focus.
         */
        newInput.focus();


        /*
         * Remettre le curseur exactement
         * là où l'utilisateur écrivait.
         */
        try{

          const length =
            newInput.value.length;

          newInput.setSelectionRange(
            Math.min(
              startToRestore,
              length
            ),
            Math.min(
              endToRestore,
              length
            )
          );

        }
        catch(e){

          console.warn(
            "Impossible de restaurer la position du curseur :",
            e
          );

        }

      },
      0
    );

  }


  /* ================================================= */
  /* STATISTIQUES */
  /* ================================================= */

  const total =
    tasks.length;

  const done =
    tasks.filter(
      t => t.done
    ).length;

  const p =

    total

    ? Math.round(
        done / total * 100
      )

    : 0;


  $("total").textContent =
    total;

  $("done").textContent =
    done;

  $("remain").textContent =
    total - done;

  $("pct").textContent =
    p + "%";

  $("fill").style.width =
    p + "%";


  /* ================================================= */
  /* PRIORITES */
  /* ================================================= */

  const high =
    tasks.filter(
      t =>
        !t.done &&
        t.priority === "high"
    ).length;


  $("prioritySummary").innerHTML =

    high

    ? `<strong>${high}</strong> tâche(s) urgente(s) à traiter.`

    : "Aucune tâche prioritaire en attente. 👍";

}


/* ================================================= */
/* AUTHENTIFICATION */
/* ================================================= */

onAuthStateChanged(
  auth,
  u => {

    if(!u){

      $("login").style.display =
        "flex";

      $("app").style.display =
        "none";

      return;

    }


    $("login").style.display =
      "none";

    $("app").style.display =
      "block";


    $("status").innerHTML =
      '<span class="dot"></span>Synchronisation active';

    $("status").className =
      "online";


    listen(
      u.uid
    );

  }
);

if(
  "serviceWorker" in navigator
){

  navigator.serviceWorker.register(
    "sw.js"
  )
  .then(
    registration => {

      console.log(
        "Service Worker enregistré :",
        registration.scope
      );

    }
  )
  .catch(
    error => {

      console.error(
        "Erreur Service Worker :",
        error
      );

    }
  );

}
